name: Price workers

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: khasm-price-workers-${{ github.repository }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        store: [noon, amazon]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Run rate-limited store worker
        env:
          KHASM_LOG_LEVEL: INFO
        run: >-
          python -m scraper.worker
          --store '${{ matrix.store }}'
          --duration-seconds 19800
          --request-interval 60
          --publish-interval 300
          --priority-categories phones,laptops
